<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' 'unsafe-inline' file: data:; img-src 'self' file: data:;"/>
    <title>Focus Points</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div id="app">
        <div id="stage">
            <!-- Preview image; the SVG overlay sits on top. Its viewBox is the
                 delegate's frame, stretched over the preview, so AF boxes line
                 up whatever the preview's pixel size or the zoom. -->
            <img id="preview" alt=""/>
            <svg id="overlay" preserveAspectRatio="none"></svg>
            <div id="placeholder">Select a photo in Bridge</div>
        </div>
        <div id="statusbar">
            <div id="leftbar">
                <div id="controls">
                    <label class="tog"><input type="checkbox" id="tg-focus" checked><span>Focus</span></label>
                    <label class="tog"><input type="checkbox" id="tg-faces" checked><span>Faces</span></label>
                    <label class="tog"><input type="checkbox" id="tg-crop" checked><span>Crop</span></label>
                </div>
                <span id="status">Loading…</span>
            </div>
            <div id="shootinfo"></div>
        </div>
    </div>

    <script src="lib/CSInterface.js"></script>
    <script src="main.js"></script>
</body>
</html>
