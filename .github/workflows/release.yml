name: Release

# git tag v1.2.3 && git push --tags
# A tag with a suffix (v1.2.3-rc1) is published as a pre-release.
on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ZXPSignCmd
        run: |
          curl -fsSL -o tools/ZXPSignCmd.exe \
            https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.103/win64/ZXPSignCmd.exe
          echo "dc2e711a46504830062ac1afede1f8ee08c1e21399b6c30d7d38cf907c35bcf5 *tools/ZXPSignCmd.exe" | sha256sum -c -

      - name: Build the signed package
        env:
          RELEASE_CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          RELEASE_CERT_PASS: ${{ secrets.RELEASE_CERT_PASS }}
        run: |
          if [ -z "$RELEASE_CERT_P12" ] || [ -z "$RELEASE_CERT_PASS" ]; then
            echo "Repo secrets RELEASE_CERT_P12 / RELEASE_CERT_PASS are not set (docs/releasing.md)" >&2
            exit 1
          fi
          export RELEASE_CERT="$RUNNER_TEMP/release.p12"
          printf '%s' "$RELEASE_CERT_P12" | base64 -d > "$RELEASE_CERT"
          VERSION="$GITHUB_REF_NAME" bash tools/build-release.sh
          rm -f "$RELEASE_CERT"

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          iscc "/DAppVersion=$version" tools\installer.iss

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            "dist/FocusPointsSetup-v$version.exe" \
            "dist/focuspoints-v$version.zxp" \
            tools/install-mac.sh \
            tools/diagnose-mac.sh
